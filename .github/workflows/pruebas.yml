name: Pruebas con Playwright

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Instalar Chromium y Firefox
        run: python -m playwright install --with-deps chromium firefox

      - name: Ejecutar la suite y las variantes de CP-18
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        shell: bash
        run: |
          set +e

          python -m pytest test_login.py test_beneficiarios.py test_edad.py test_suite.py --browser chromium -v
          suite_status=$?

          python -m pytest test_suite.py::test_cp18_boton_bloqueado_sin_cantidad --browser firefox -v
          firefox_status=$?

          python -m pytest test_suite.py::test_cp18_movil_android_sin_cantidad --browser chromium -v
          mobile_status=$?

          if [ "$suite_status" -ne 0 ] || [ "$firefox_status" -ne 0 ] || [ "$mobile_status" -ne 0 ]; then
            exit 1
          fi
